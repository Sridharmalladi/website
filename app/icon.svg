<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The man walking emoji, set as text so the browser draws it with whatever
       emoji font the machine has. That means it looks native on a Mac, on
       Windows and on a phone, and it costs one line instead of a traced figure.
       No background: the glyph sits on its own in the tab. -->
  <text x="32" y="50" text-anchor="middle" font-size="54"
        font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🚶‍♂️</text>
</svg>
