<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Panda, no background. Drawn heavy on purpose: in a browser tab this is
       sixteen pixels across, so the ears, the eye patches and the nose are the
       only things that survive. The head carries a soft grey edge so it does
       not disappear against a white tab strip. -->

  <!-- ears, behind the head -->
  <circle cx="16" cy="17" r="10" fill="#15161a"/>
  <circle cx="48" cy="17" r="10" fill="#15161a"/>

  <!-- head -->
  <ellipse cx="32" cy="35" rx="25" ry="23" fill="#fbfbfa" stroke="#c7cbd2" stroke-width="1.4"/>

  <!-- eye patches, tilted in towards the nose -->
  <ellipse cx="21" cy="31" rx="8.4" ry="10" fill="#15161a" transform="rotate(-20 21 31)"/>
  <ellipse cx="43" cy="31" rx="8.4" ry="10" fill="#15161a" transform="rotate(20 43 31)"/>

  <!-- eyes -->
  <circle cx="22.5" cy="31.5" r="3.4" fill="#fbfbfa"/>
  <circle cx="41.5" cy="31.5" r="3.4" fill="#fbfbfa"/>
  <circle cx="23.2" cy="32" r="1.9" fill="#15161a"/>
  <circle cx="40.8" cy="32" r="1.9" fill="#15161a"/>

  <!-- nose and mouth -->
  <path d="M27.4 43.2 C 29 41.6, 35 41.6, 36.6 43.2 C 35.4 46.6, 33.8 48, 32 48 C 30.2 48, 28.6 46.6, 27.4 43.2 Z" fill="#15161a"/>
  <path d="M32 48.4 C 32 51, 29.4 52.4, 27.6 51" fill="none" stroke="#15161a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M32 48.4 C 32 51, 34.6 52.4, 36.4 51" fill="none" stroke="#15161a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
